<style>
:root{--bg-void:#06060A;--bg-surface:#0D0D14;--bg-elevated:#13131E;--bg-border:#242436;--gold:#D4A84B;--gold-bright:#E8C06A;--gold-glow:rgba(212,168,75,0.12);--text-primary:#F0EFEA;--text-secondary:#8C8CA0;--text-muted:#52525F;--font-display:'Sora',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;--radius-md:8px;--radius-lg:12px;--radius-pill:100px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-void);color:var(--text-primary);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased;overflow:hidden}

.content{position:relative;z-index:1;max-width:520px}
.code{font-family:var(--font-mono);font-size:7rem;font-weight:400;line-height:1;letter-spacing:-.06em;color:var(--bg-border);margin-bottom:1.5rem;position:relative}
.code-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:7rem;font-weight:700;letter-spacing:-.06em;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 50%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite;background-size:200%}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
h1{font-family:var(--font-display);font-size:1.75rem;font-weight:700;letter-spacing:-.03em;margin-bottom:.875rem;color:var(--text-primary)}
p{font-size:1rem;color:var(--text-secondary);line-height:1.7;margin-bottom:2.5rem}
.btn-row{display:flex;gap:.875rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--font-body);font-size:.9375rem;font-weight:500;border-radius:var(--radius-md);padding:.625rem 1.375rem;border:1px solid transparent;cursor:pointer;transition:all .18s;text-decoration:none}
.btn--primary{background:var(--gold);color:var(--bg-void);border-color:var(--gold);font-weight:600}
.btn--primary:hover{background:var(--gold-bright)}
.btn--secondary{background:transparent;color:var(--text-primary);border-color:var(--bg-border)}
.btn--secondary:hover{background:var(--bg-elevated)}
.quick-links{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--bg-border);display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.quick-links a{font-size:.875rem;color:var(--text-muted);text-decoration:none;transition:color .2s}
.quick-links a:hover{color:var(--gold)}
